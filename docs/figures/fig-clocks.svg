<text x="512" y="566" font-size="22" fill="#eb6834" text-anchor="start" font-weight="600">single clock of Section 5.2, superseded</text>
<text x="44" y="608" font-size="22" fill="#14202E" text-anchor="start" font-weight="400">By 2026 the two models differ by 63 points: the first reports Low, the second Medium.</text>
<text x="44" y="638" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">The three records are identical throughout. Only the treatment of what cannot be changed differs.</text>
<text x="44" y="668" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">Permanent attributes rise from 72% of the raw score in 2019 to 100% by 2025.</text>
