<text x="108" y="506" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="start" font-weight="600">Why an individual cannot wait to be told</text>
<text x="108" y="530" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">Half of all breaches took more than 20 days merely to be noticed, and the mean is</text>
<text x="108" y="551" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">101.8, because the distribution has a long tail: the slowest single case in the sample</text>
<text x="108" y="572" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">took 3,140 days to identify. Someone waiting to be notified is therefore exposed for</text>
<text x="108" y="593" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">months in the median case and years in the tail, which is the condition this thesis</text>
<text x="108" y="614" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">designs for.</text>
</svg>