<text x="500.0" y="46" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="32" fill="#14202E" text-anchor="middle" font-weight="600">How long before the people in a breach are told</text>
<text x="500.0" y="76" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="23" fill="#5A6B7F" text-anchor="middle" font-weight="400" font-style="italic">2,123 breach reports filed in California, 2012–2020 · Xu and Nguyen (2025)</text>
<rect x="150" y="115" width="26" height="22" rx="4" fill="#B8862F" fill-opacity="0.18" stroke="#B8862F" stroke-width="2"/>
<text x="186" y="133" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">breach occurs → company notices</text>
<rect x="546" y="115" width="26" height="22" rx="4" fill="#0D7D74" fill-opacity="0.18" stroke="#0D7D74" stroke-width="2"/>
<text x="582" y="133" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">company notices → people told</text>
