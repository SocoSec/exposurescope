<rect x="478.24868282402525" y="312" width="199.9479452054794" height="36" rx="5" fill="#0D7D74" fill-opacity="0.18" stroke="#0D7D74" stroke-width="2"/>
<text x="578.222655426765" y="302" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="middle" font-weight="600">62.01</text>
<text x="784" y="338" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="start" font-weight="600">189.8 days in all</text>
