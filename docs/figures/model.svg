<path d="M47.0,566.0 L51.4,580.5 L55.7,593.3 L60.1,604.7 L64.5,614.8 L68.8,623.8 L73.2,631.7 L77.6,638.7 L81.9,645.0 L86.3,650.5 L90.7,655.4 L95.0,659.8 L99.4,663.7 L103.8,667.1 L108.1,670.1 L112.5,672.8 L116.9,675.2 L121.2,677.4 L125.6,679.2 L130.0,680.9 L134.3,682.4 L138.7,683.7 L143.1,684.9 L147.4,685.9 L151.8,686.8 L156.2,687.6 L160.5,688.3 L164.9,689.0 L169.3,689.6 L173.6,690.1 L178.0,690.5 L182.4,690.9 L186.7,691.2 L191.1,691.6 L195.5,691.8 L199.8,692.1 L204.2,692.3 L208.6,692.5 L212.9,692.7 L217.3,692.8 L221.7,692.9 L226.0,693.1 L230.4,693.2 L234.8,693.3 L239.1,693.3 L243.5,693.4 L247.9,693.5 L252.2,693.5 L256.6,693.6 L261.0,693.6 L265.3,693.7 L269.7,693.7 L274.1,693.8 L278.4,693.8 L282.8,693.8 L287.2,693.8 L291.5,693.8 L295.9,693.9 L300.3,693.9 L304.6,693.9 L309.0,693.9" fill="none" stroke="#B8862F" stroke-width="3"/>
