<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1258" width="1000" height="1258" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14202E"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#14202E" stroke-width="1.6"/></marker><marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#FFFFFF" stroke="#14202E" stroke-width="1.6"/></marker></defs>
<rect width="1000" height="1258" fill="#FFFFFF"/>
<text x="500.0" y="46" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="32" fill="#14202E" text-anchor="middle" font-weight="600">How the Breach Risk score is computed</text>
<text x="500.0" y="76" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="23" fill="#5A6B7F" text-anchor="middle" font-weight="400" font-style="italic">Three terms, summed raw and normalised once · lib/score.js</text>
<rect x="190.0" y="103.0" width="620" height="58" rx="10" fill="#F6F8FA" stroke="#44566B" stroke-width="2.2"/>
<text x="500" y="140.16" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="24" fill="#14202E" text-anchor="middle" font-weight="400">Every breach the identifier appears in, from six sources</text>
<path d="M500,161 L178,196 L178,222" fill="none" stroke="#B8862F" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M500,161 L500,196 L500,222" fill="none" stroke="#C2543B" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M500,161 L822,196 L822,222" fill="none" stroke="#0D7D74" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="25.0" y="222" width="306" height="262" rx="10" fill="#FFFFFF" stroke="#B8862F" stroke-width="2.4"/>
<path d="M25.0,232 a10,10 0 0 1 10,-10 L321.0,222 a10,10 0 0 1 10,10 L331.0,264 L25.0,264 Z" fill="#B8862F"/>
<text x="178" y="252" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">What can be revoked</text>
<text x="178" y="291.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">Passwords, tokens,</text>
<text x="178" y="319.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">payment cards</text>
<path d="M47.0,326 L309.0,326" stroke="#B9C4D0" stroke-width="1.4"/>
<text x="178" y="354" font-family="Consolas, Courier New, monospace" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">B_cred =</text>
<text x="178" y="380" font-family="Consolas, Courier New, monospace" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">Σ sev · κ · e^(−λ·age)</text>
<path d="M47.0,402 L309.0,402" stroke="#B9C4D0" stroke-width="1.4"/>
<text x="178" y="423.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">Changing it makes the</text>
<text x="178" y="451.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">leaked copy worthless.</text>
<text x="178" y="479.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">Half-life 347 days.</text>
<rect x="347.0" y="222" width="306" height="262" rx="10" fill="#FFFFFF" stroke="#C2543B" stroke-width="2.4"/>
<path d="M347.0,232 a10,10 0 0 1 10,-10 L643.0,222 a10,10 0 0 1 10,10 L653.0,264 L347.0,264 Z" fill="#C2543B"/>
<text x="500" y="252" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">What expires by itself</text>
<text x="500" y="291.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">Live sessions taken by</text>
<text x="500" y="319.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">infostealer malware</text>
<path d="M369.0,326 L631.0,326" stroke="#B9C4D0" stroke-width="1.4"/>
<text x="500" y="354" font-family="Consolas, Courier New, monospace" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">V =</text>
<text x="500" y="380" font-family="Consolas, Courier New, monospace" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">Σ e^(−λᵥ · age)</text>
<path d="M369.0,402 L631.0,402" stroke="#B9C4D0" stroke-width="1.4"/>
<text x="500" y="423.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">A password change does</text>
<text x="500" y="451.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">not revoke it; it lapses.</text>
<text x="500" y="479.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">Half-life 30 days.</text>
<rect x="669.0" y="222" width="306" height="262" rx="10" fill="#FFFFFF" stroke="#0D7D74" stroke-width="2.4"/>
<path d="M669.0,232 a10,10 0 0 1 10,-10 L965.0,222 a10,10 0 0 1 10,10 L975.0,264 L669.0,264 Z" fill="#0D7D74"/>
<text x="822" y="252" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">What cannot be changed</text>
<text x="822" y="291.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">Date of birth, name,</text>
<text x="822" y="319.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">address, phone, ID</text>
<path d="M691.0,326 L953.0,326" stroke="#B9C4D0" stroke-width="1.4"/>
<text x="822" y="354" font-family="Consolas, Courier New, monospace" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">I =</text>
<text x="822" y="380" font-family="Consolas, Courier New, monospace" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">1 − Π (1 − w)</text>
<path d="M691.0,402 L953.0,402" stroke="#B9C4D0" stroke-width="1.4"/>
<text x="822" y="423.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">As true today as the day</text>
<text x="822" y="451.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">it leaked. Counted once,</text>
<text x="822" y="479.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">however many breaches.</text>
<text x="500" y="524" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="middle" font-weight="600">How each term behaves over ten years</text>
