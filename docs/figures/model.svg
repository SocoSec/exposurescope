<text x="947.0" y="718" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="end" font-weight="400">10 years</text>
<path d="M178,740 L178,776 L500,776 L500,800" fill="none" stroke="#B8862F" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M500,740 L500,776 L500,776 L500,800" fill="none" stroke="#C2543B" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M822,740 L822,776 L500,776 L500,800" fill="none" stroke="#0D7D74" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="140.0" y="803.0" width="720" height="62" rx="10" fill="#F6F8FA" stroke="#14202E" stroke-width="2.2"/>
<text x="500" y="842.16" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="24" fill="#14202E" text-anchor="middle" font-weight="600">B_raw  =  B_cred  +  0.70 · I  +  0.60 · V</text>
<text x="500" y="886" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400" font-style="italic">summed raw, not averaged: a term that finds nothing contributes exactly zero</text>
<path d="M500,900 L500,926" fill="none" stroke="#14202E" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="140.0" y="926.0" width="720" height="76" rx="10" fill="#FFFFFF" stroke="#14202E" stroke-width="2.2"/>
<text x="500" y="957.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">B  =  min(1,  B_raw / 0.8)</text>
<text x="500" y="985.48" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">score  =  round(100 · B),  at least 1 where anything was found</text>
<path d="M500,1002 L500,1026" fill="none" stroke="#14202E" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="115.0" y="1030" width="182" height="58" rx="8" fill="#FFFFFF" stroke="#8A94A6" stroke-width="2.4"/>
<text x="206.0" y="1056" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#8A94A6" text-anchor="middle" font-weight="600">Safe</text>
<text x="206.0" y="1078" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">no exposure</text>
<rect x="311.0" y="1030" width="182" height="58" rx="8" fill="#FFFFFF" stroke="#2E9E6B" stroke-width="2.4"/>
<text x="402.0" y="1056" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#2E9E6B" text-anchor="middle" font-weight="600">Low</text>
<text x="402.0" y="1078" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">1–35</text>
<rect x="507.0" y="1030" width="182" height="58" rx="8" fill="#FFFFFF" stroke="#C98A1B" stroke-width="2.4"/>
<text x="598.0" y="1056" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#C98A1B" text-anchor="middle" font-weight="600">Medium</text>
<text x="598.0" y="1078" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">36–65</text>
<rect x="703.0" y="1030" width="182" height="58" rx="8" fill="#FFFFFF" stroke="#C2543B" stroke-width="2.4"/>
<text x="794.0" y="1056" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#C2543B" text-anchor="middle" font-weight="600">High</text>
<text x="794.0" y="1078" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">66–100</text>
<path d="M70,1110 L912,1110 L930,1128 L930,1224 L70,1224 Z" fill="#FFFFFF" stroke="#5A6B7F" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M912,1110 L912,1128 L930,1128" fill="none" stroke="#5A6B7F" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="86" y="1138" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="start" font-weight="600">Why three terms and not one</text>
<text x="86" y="1162" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">The first two terms fall as the exposure ages; the third does not, and for</text>
<text x="86" y="1183" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">most subjects it is the larger of the three. That separation is the subject</text>
<text x="86" y="1204" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">of Section 5.8, and Figure 6 measures what it is worth.</text>
</svg>