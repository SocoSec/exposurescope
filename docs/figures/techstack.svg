<text x="1216" y="504" font-size="17" fill="#53627A">14 ES modules, no I/O</text>
<text x="1216" y="526" font-size="17" fill="#53627A">score &#183; tokens &#183; playbook &#183; agent</text>

<rect x="846" y="556" width="684" height="112" rx="6" fill="#FAE8E4" stroke="#B8372A" stroke-width="2.8"/>
<text x="872" y="590" font-size="20" font-weight="700" fill="#B8372A">No artifact is deployed for persistence.</text>
<text x="872" y="620" font-size="17.5" fill="#8A3B2E">This node has no database, object store or session store. Session state is</text>
<text x="872" y="646" font-size="17.5" fill="#8A3B2E">carried by a signed token held on the User Device and expires with it.</text>

<text x="818" y="736" font-size="17.5" fill="#53627A">Node constraints:  stateless &#183; no process persists between requests &#183; Node &#8805; 18.17 API surface</text>
<text x="818" y="766" font-size="17.5" fill="#53627A">Deployed by Vercel from branch <tspan font-family="Consolas, monospace" fill="#101922">main</tspan> on push. No container image, no long-running server.</text>
<text x="818" y="796" font-size="17.5" fill="#53627A">Dependencies resolved at build: <tspan font-family="Consolas, monospace" font-weight="700" fill="#101922">next</tspan>, <tspan font-family="Consolas, monospace" font-weight="700" fill="#101922">react</tspan>, <tspan font-family="Consolas, monospace" font-weight="700" fill="#101922">react-dom</tspan> &#8212; 19 packages in total.</text>

