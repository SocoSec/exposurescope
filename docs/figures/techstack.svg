<text x="312" y="238" font-size="20" font-style="italic" fill="#53627A" text-anchor="middle">&#171;device&#187;</text>
<text x="312" y="276" font-size="30" font-weight="700" fill="#101922" text-anchor="middle">User Device</text>

<rect x="82" y="306" width="460" height="452" rx="7" fill="#FFFFFF" stroke="#5A6B85" stroke-width="3" stroke-dasharray="11 7"/>
<text x="312" y="342" font-size="19" font-style="italic" fill="#53627A" text-anchor="middle">&#171;executionEnvironment&#187;</text>
<text x="312" y="378" font-size="26" font-weight="700" fill="#101922" text-anchor="middle">Web Browser</text>

<rect x="108" y="404" width="408" height="160" rx="7" fill="#E9F3FB" stroke="#2F86C4" stroke-width="3"/>
<use href="#art" x="128" y="424" width="40" height="48"/>
<text x="184" y="442" font-size="19" font-style="italic" fill="#53627A">&#171;artifact&#187;</text>
<text x="184" y="474" font-size="25" font-weight="700" fill="#101922">exposio page</text>
<text x="128" y="512" font-size="20" fill="#53627A">React 18.3.1 &#183; Next.js</text>
<text x="128" y="542" font-size="20" fill="#53627A">8 components &#183; inline SVG</text>

<rect x="108" y="584" width="408" height="160" rx="7" fill="#E0F3EB" stroke="#136B51" stroke-width="3"/>
<use href="#art" x="128" y="604" width="40" height="48"/>
<text x="184" y="622" font-size="19" font-style="italic" fill="#53627A">&#171;artifact&#187;</text>
<text x="184" y="654" font-size="25" font-weight="700" fill="#136B51">k-anonymity check</text>
<text x="128" y="692" font-size="20" fill="#2F6B55">Web Crypto &#183; SHA-1 here</text>
<text x="128" y="722" font-size="20" fill="#2F6B55">5 characters leave, no more</text>

<!-- ══════ VERCEL EDGE ══════ -->
<path d="M688 196 l24 -24 h588 l-24 24 z" fill="#D9E6F2" stroke="#1B6498" stroke-width="3.2" stroke-linejoin="round"/>
<path d="M1276 196 l24 -24 v666 l-24 24 z" fill="#C6D9EA" stroke="#1B6498" stroke-width="3.2" stroke-linejoin="round"/>
<rect x="688" y="196" width="588" height="690" fill="#EEF5FC" stroke="#1B6498" stroke-width="3.2"/>
<text x="982" y="238" font-size="20" font-style="italic" fill="#1B6498" text-anchor="middle">&#171;device&#187;</text>
<text x="982" y="276" font-size="30" font-weight="700" fill="#101922" text-anchor="middle">Vercel Edge Network</text>

<rect x="716" y="306" width="532" height="330" rx="7" fill="#FFFFFF" stroke="#2F86C4" stroke-width="3" stroke-dasharray="11 7"/>
<text x="982" y="342" font-size="19" font-style="italic" fill="#53627A" text-anchor="middle">&#171;executionEnvironment&#187;</text>
<text x="982" y="378" font-size="26" font-weight="700" fill="#101922" text-anchor="middle">Edge Runtime &#183; V8 isolate</text>

<rect x="742" y="404" width="480" height="104" rx="7" fill="#E9F3FB" stroke="#2F86C4" stroke-width="3"/>
<use href="#art" x="760" y="420" width="38" height="46"/>
<text x="814" y="438" font-size="19" font-style="italic" fill="#53627A">&#171;artifact&#187;</text>
<text x="814" y="468" font-size="25" font-weight="700" fill="#101922">Route Handlers</text>
<text x="814" y="496" font-size="20" fill="#53627A">Next.js 14.2.35 &#183; 4 endpoints</text>

<rect x="742" y="522" width="480" height="104" rx="7" fill="#EDE7FA" stroke="#6D55BD" stroke-width="3"/>
<use href="#art" x="760" y="538" width="38" height="46"/>
<text x="814" y="556" font-size="19" font-style="italic" fill="#53627A">&#171;artifact&#187;</text>
<text x="814" y="586" font-size="25" font-weight="700" fill="#101922">lib/ domain modules</text>
<text x="814" y="614" font-size="20" fill="#53627A">14 ES modules &#183; no I/O</text>

<rect x="716" y="660" width="532" height="130" rx="7" fill="#FAE8E4" stroke="#B8372A" stroke-width="3.2"/>
<text x="982" y="700" font-size="24" font-weight="700" fill="#B8372A" text-anchor="middle">No persistence artifact</text>
<text x="982" y="734" font-size="20" fill="#8A3B2E" text-anchor="middle">is deployed on this node.</text>
<text x="982" y="768" font-size="20" fill="#8A3B2E" text-anchor="middle">State travels in a signed token.</text>

<text x="716" y="836" font-size="20" fill="#53627A">Stateless &#183; no process persists between requests</text>
<text x="716" y="868" font-size="20" fill="#53627A">Deployed from <tspan font-family="Consolas, monospace" fill="#101922">main</tspan> on push &#183; Node &#8805; 18.17</text>

