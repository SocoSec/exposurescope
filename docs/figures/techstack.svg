<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Exposio deployment diagram</title>
<desc>UML deployment diagram: devices, execution environments, artifacts and communication paths.</desc>

<defs>
  <marker id="ar" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M1 1 L11 6 L1 11" fill="none" stroke="#1E2A3C" stroke-width="2.2"/>
  </marker>
  <marker id="arg" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
    <path d="M1 1 L11 6 L1 11" fill="none" stroke="#136B51" stroke-width="2.2"/>
  </marker>
  <symbol id="art" viewBox="0 0 40 48">
    <path d="M3 3 h22 l12 12 v30 h-34 z" fill="#FFFFFF" stroke="#4A5668" stroke-width="3"/>
    <path d="M25 3 v12 h12" fill="none" stroke="#4A5668" stroke-width="3"/>
  </symbol>
</defs>

<rect width="2000" height="1300" fill="#FFFFFF"/>
<text x="44" y="62" font-size="37" font-weight="700" fill="#101922">Exposio &#8212; deployment diagram</text>
<text x="44" y="102" font-size="22" fill="#53627A">UML deployment notation. Figure 1 of 2; the technology summary follows as a table.</text>

<!-- ══════ USER DEVICE ══════ -->
