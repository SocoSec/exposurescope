<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1340" viewBox="0 0 2240 1340"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Exposio technology stack</title>
<desc>Layered technology stack: presentation, edge runtime, pure domain logic, platform APIs, state, and external services.</desc>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#243247"/>
  </marker>
  <symbol id="win" viewBox="0 0 64 64">
    <rect x="5" y="10" width="54" height="44" rx="6" fill="#E4F1FB" stroke="#2F86C4" stroke-width="3"/>
    <path d="M5 23 h54" stroke="#2F86C4" stroke-width="3"/>
    <circle cx="14" cy="16.5" r="2.6" fill="#2F86C4"/><circle cx="23" cy="16.5" r="2.6" fill="#2F86C4"/>
  </symbol>
  <symbol id="fn" viewBox="0 0 64 64">
    <rect x="3" y="3" width="58" height="58" rx="11" fill="#E4F1FB" stroke="#2F86C4" stroke-width="3"/>
    <path d="M36 11 L21 36 h10 l-4 17 16-25 H29 z" fill="#F5A623" stroke="#B9760E" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>
  <symbol id="mod" viewBox="0 0 64 64">
    <path d="M32 5 L56 18.5 v27 L32 59 L8 45.5 v-27 z" fill="#EDE7FA" stroke="#6D55BD" stroke-width="3.2"/>
    <path d="M23 32 h18 M32 23 v18" stroke="#6D55BD" stroke-width="3.6" stroke-linecap="round"/>
  </symbol>
  <symbol id="chip" viewBox="0 0 64 64">
    <rect x="16" y="16" width="32" height="32" rx="4" fill="#E0F3EB" stroke="#15785A" stroke-width="3"/>
    <path d="M24 16 v-8 M32 16 v-8 M40 16 v-8 M24 48 v8 M32 48 v8 M40 48 v8
             M16 24 h-8 M16 32 h-8 M16 40 h-8 M48 24 h8 M48 32 h8 M48 40 h8"
          stroke="#15785A" stroke-width="3" stroke-linecap="round"/>
  </symbol>
  <symbol id="nodb" viewBox="0 0 64 64">
    <ellipse cx="32" cy="14" rx="23" ry="8.5" fill="#FAE8E4" stroke="#B8372A" stroke-width="3"/>
    <path d="M9 14 v34 c0 4.7 10.3 8.5 23 8.5 s23-3.8 23-8.5 V14" fill="#FAE8E4" stroke="#B8372A" stroke-width="3"/>
    <path d="M9 31 c0 4.7 10.3 8.5 23 8.5 s23-3.8 23-8.5" fill="none" stroke="#B8372A" stroke-width="3"/>
    <path d="M11 55 L53 9" stroke="#B8372A" stroke-width="6.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="cloud" viewBox="0 0 64 64">
    <path d="M18 46 a12 12 0 0 1 1-24 a15 15 0 0 1 28 4 a10 10 0 0 1 -2 20 z"
          fill="#FCEEDD" stroke="#C97612" stroke-width="3"/>
  </symbol>
  <symbol id="check" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="26" fill="#E0F3EB" stroke="#15785A" stroke-width="3"/>
    <path d="M20 33 l8.5 8.5 16 -18" fill="none" stroke="#15785A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</defs>

<rect width="2240" height="1340" fill="#FFFFFF"/>
<text x="44" y="56" font-size="33" font-weight="700" fill="#101922">Exposio &#8212; technology stack</text>
<text x="44" y="90" font-size="18.5" fill="#53627A">What the system is built of. Every item below is in the repository; nothing is aspirational.</text>

<!-- ══════ LAYER 1 ══════ -->
<rect x="44" y="134" width="1480" height="166" rx="16" fill="#F4F9FD" stroke="#9EC6E4" stroke-width="2.4"/>
<rect x="44" y="134" width="250" height="166" rx="16" fill="#E4F1FB"/>
<rect x="276" y="134" width="18" height="166" fill="#E4F1FB"/>
<use href="#win" x="74" y="162" width="52" height="52"/>
<text x="74" y="244" font-size="20" font-weight="700" fill="#1B6498">Presentation</text>
<text x="74" y="268" font-size="15" fill="#1B6498">runs in the browser</text>
<text x="320" y="176" font-size="17" font-weight="700" fill="#101922">React 18.3.1  &#183;  Next.js App Router (client components)  &#183;  8 components</text>
<text x="320" y="208" font-size="16" fill="#53627A">Charts, icons and the exposure map are hand-written inline SVG &#8212; <tspan font-weight="650" fill="#101922">no chart library, no icon font</tspan>.</text>
<text x="320" y="236" font-size="16" fill="#53627A">Styling is one 371-line JavaScript string injected at render &#8212; <tspan font-weight="650" fill="#101922">no CSS framework, no .css file</tspan>.</text>
<text x="320" y="264" font-size="16" fill="#53627A">Web Crypto computes the password hash here, so the secret never leaves the device.</text>

<!-- ══════ LAYER 2 ══════ -->
<rect x="44" y="318" width="1480" height="150" rx="16" fill="#F7F5FC" stroke="#A99BD6" stroke-width="2.4"/>
<rect x="44" y="318" width="250" height="150" rx="16" fill="#EDE7FA"/>
<rect x="276" y="318" width="18" height="150" fill="#EDE7FA"/>
<use href="#fn" x="74" y="344" width="52" height="52"/>
<text x="74" y="420" font-size="20" font-weight="700" fill="#4B3E8E">Application</text>
<text x="74" y="444" font-size="15" fill="#4B3E8E">Vercel Edge Runtime</text>
<text x="320" y="358" font-size="17" font-weight="700" fill="#101922">Next.js 14.2.35 Route Handlers  &#183;  <tspan font-family="Consolas, monospace">runtime = &quot;edge&quot;</tspan> on all four endpoints</text>
<text x="320" y="392" font-size="16" fill="#53627A"><tspan font-family="Consolas, monospace" fill="#101922">/api/verify/start</tspan> issue a one-time code</text>
<text x="940" y="392" font-size="16" fill="#53627A"><tspan font-family="Consolas, monospace" fill="#101922">/api/breach</tspan> look up, merge, score</text>
<text x="320" y="420" font-size="16" fill="#53627A"><tspan font-family="Consolas, monospace" fill="#101922">/api/verify/check</tspan> the ownership gate</text>
<text x="940" y="420" font-size="16" fill="#53627A"><tspan font-family="Consolas, monospace" fill="#101922">/api/chat</tspan> the bounded agent loop</text>
<text x="320" y="450" font-size="15.5" fill="#53627A">No long-running server, no container, no process to keep alive between requests.</text>

<!-- ══════ LAYER 3 ══════ -->
<rect x="44" y="486" width="1480" height="186" rx="16" fill="#F7F5FC" stroke="#A99BD6" stroke-width="2.4"/>
<rect x="44" y="486" width="250" height="186" rx="16" fill="#EDE7FA"/>
<rect x="276" y="486" width="18" height="186" fill="#EDE7FA"/>
<use href="#mod" x="74" y="514" width="52" height="52"/>
<text x="74" y="596" font-size="20" font-weight="700" fill="#4B3E8E">Domain logic</text>
<text x="74" y="620" font-size="15" fill="#4B3E8E">pure JavaScript, no I/O</text>
<text x="74" y="644" font-size="15" fill="#4B3E8E">14 modules in lib/</text>
<text x="320" y="524" font-size="17" font-weight="700" fill="#101922">The same files run on the server, in the browser and in the offline tests.</text>
<g font-size="15.5" fill="#53627A">
  <text x="320" y="558"><tspan font-weight="700" fill="#101922">score.js</tspan>  two-clock Breach Risk</text>
  <text x="700" y="558"><tspan font-weight="700" fill="#101922">tokens.js</tspan>  HMAC-SHA256, keyed hash</text>
  <text x="1120" y="558"><tspan font-weight="700" fill="#101922">crypto.js</tspan>  Web Crypto helpers</text>
  <text x="320" y="590"><tspan font-weight="700" fill="#101922">playbook.js</tspan>  actions, residual risk</text>
  <text x="700" y="590"><tspan font-weight="700" fill="#101922">sources.js</tspan>  query and merge</text>
  <text x="1120" y="590"><tspan font-weight="700" fill="#101922">agent.js</tspan>  bounded tool loop</text>
  <text x="320" y="622"><tspan font-weight="700" fill="#101922">expobot.js</tspan>  prompt, fencing</text>
  <text x="700" y="622"><tspan font-weight="700" fill="#101922">ratelimit.js</tspan>  fixed window</text>
  <text x="1120" y="622"><tspan font-weight="700" fill="#101922">gdpr.js</tspan>  Art. 15 / 17 letters</text>
  <text x="320" y="654"><tspan font-weight="700" fill="#101922">http.js</tspan>  parse, normalise</text>
  <text x="700" y="654"><tspan font-weight="700" fill="#101922">mailer.js / sms.js</tspan>  delivery</text>
  <text x="1120" y="654"><tspan font-weight="700" fill="#101922">config.js &#183; content.js</tspan></text>
</g>

<!-- ══════ LAYER 4 ══════ -->
<rect x="44" y="690" width="1480" height="142" rx="16" fill="#F2FAF6" stroke="#8FC6B0" stroke-width="2.4"/>
<rect x="44" y="690" width="250" height="142" rx="16" fill="#E0F3EB"/>
<rect x="276" y="690" width="18" height="142" fill="#E0F3EB"/>
<use href="#chip" x="74" y="714" width="52" height="52"/>
<text x="74" y="790" font-size="20" font-weight="700" fill="#15785A">Platform APIs</text>
<text x="74" y="814" font-size="15" fill="#15785A">used instead of libraries</text>
<text x="320" y="728" font-size="17" font-weight="700" fill="#101922">Standard web APIs, available in both the browser and the edge runtime.</text>
<text x="320" y="762" font-size="16" fill="#53627A"><tspan font-weight="700" fill="#101922">Web Crypto</tspan>  importKey, sign, verify &#8212; the signed tokens, and SHA-1 for k-anonymity</text>
<text x="320" y="790" font-size="16" fill="#53627A"><tspan font-weight="700" fill="#101922">fetch</tspan> every outbound call</text>
<text x="940" y="790" font-size="16" fill="#53627A"><tspan font-weight="700" fill="#101922">TextEncoder</tspan>, <tspan font-weight="700" fill="#101922">btoa</tspan> encoding and Basic auth</text>
<text x="320" y="818" font-size="15.5" font-weight="650" fill="#15785A">No crypto library. No HTTP client. No polyfills.</text>

<!-- ══════ LAYER 5 ══════ -->
<rect x="44" y="850" width="1480" height="142" rx="16" fill="#FDF4F2" stroke="#D99B8C" stroke-width="2.4"/>
<rect x="44" y="850" width="250" height="142" rx="16" fill="#FAE8E4"/>
<rect x="276" y="850" width="18" height="142" fill="#FAE8E4"/>
<use href="#nodb" x="74" y="874" width="52" height="52"/>
<text x="74" y="950" font-size="20" font-weight="700" fill="#B8372A">State</text>
<text x="74" y="974" font-size="15" fill="#B8372A">there isn&#8217;t any</text>
<text x="320" y="888" font-size="17" font-weight="700" fill="#B8372A">No database. No ORM. No session store. No object storage. No log of who asked what.</text>
<text x="320" y="922" font-size="16" fill="#53627A">Session state travels in a signed token held by the browser: <tspan font-family="Consolas, monospace" fill="#101922">v1.&lt;payload&gt;.&lt;signature&gt;</tspan></text>
<text x="320" y="950" font-size="16" fill="#53627A"><tspan font-weight="700" fill="#101922">Optional:</tspan> Upstash Redis over REST, holding only rate-limit counters keyed by a hash.</text>
<text x="320" y="978" font-size="15.5" fill="#53627A">Without it the limiter falls back to an in-memory window, per instance.</text>

<!-- ══════ LAYER 6 ══════ -->
<rect x="44" y="1010" width="1480" height="166" rx="16" fill="#FFFAF2" stroke="#DCAE6B" stroke-width="2.4"/>
<rect x="44" y="1010" width="250" height="166" rx="16" fill="#FCEEDD"/>
<rect x="276" y="1010" width="18" height="166" fill="#FCEEDD"/>
<use href="#cloud" x="74" y="1038" width="52" height="52"/>
<text x="74" y="1118" font-size="20" font-weight="700" fill="#A2620D">External services</text>
<text x="74" y="1142" font-size="15" fill="#A2620D">queried per request</text>
<g font-size="16.5" fill="#53627A">
  <text x="320" y="1052"><tspan font-weight="700" fill="#101922">Have I Been Pwned</tspan>  breach records for an address</text>
  <text x="940" y="1052"><tspan font-weight="700" fill="#101922">Pwned Passwords</tspan>  range API, called by the browser</text>
  <text x="320" y="1090"><tspan font-weight="700" fill="#101922">DeHashed</tspan>  second source; the only one for phones</text>
  <text x="940" y="1090"><tspan font-weight="700" fill="#101922">Anthropic API</tspan>  wording for the advisory agent</text>
  <text x="320" y="1128"><tspan font-weight="700" fill="#101922">Resend</tspan>  delivers the email code</text>
  <text x="940" y="1128"><tspan font-weight="700" fill="#101922">Twilio</tspan>  delivers the SMS code</text>
  <text x="320" y="1160" font-size="15.5">Each is reached with <tspan font-family="Consolas, monospace">fetch</tspan> and an API key held in the environment; none holds an account for the user.</text>
</g>

<!-- ══════ RIGHT: the headline ══════ -->
<rect x="1560" y="134" width="640" height="280" rx="16" fill="#E0F3EB" stroke="#15785A" stroke-width="3"/>
<use href="#check" x="1590" y="162" width="52" height="52"/>
<text x="1664" y="186" font-size="21" font-weight="700" fill="#15785A">The whole dependency list</text>
<text x="1664" y="212" font-size="16" fill="#1F5C47">in package.json, in full:</text>
<text x="1590" y="256" font-size="19" font-family="Consolas, monospace" font-weight="700" fill="#101922">next 14.2.35</text>
<text x="1590" y="288" font-size="19" font-family="Consolas, monospace" font-weight="700" fill="#101922">react 18.3.1</text>
<text x="1590" y="320" font-size="19" font-family="Consolas, monospace" font-weight="700" fill="#101922">react-dom 18.3.1</text>
<text x="1590" y="358" font-size="16" fill="#1F5C47"><tspan font-weight="700">19</tspan> packages in node_modules, counting</text>
<text x="1590" y="382" font-size="16" fill="#1F5C47">everything those three pull in with them.</text>

<!-- ══════ RIGHT: build and verification ══════ -->
<rect x="1560" y="440" width="640" height="358" rx="16" fill="#F7F9FC" stroke="#C3D0DF" stroke-width="2.4"/>
<text x="1590" y="478" font-size="20" font-weight="700" fill="#101922">Build and verification</text>
<text x="1590" y="512" font-size="16" fill="#53627A">Node &#8805; 18.17  &#183;  ES modules  &#183;  no build step beyond Next</text>
<text x="1590" y="548" font-size="16.5" font-weight="700" fill="#101922">npm run &#8230;</text>
<g font-size="16" fill="#53627A">
  <text x="1590" y="580"><tspan font-family="Consolas, monospace" font-weight="700" fill="#101922">selftest</tspan>      end-to-end correctness</text>
  <text x="1590" y="612"><tspan font-family="Consolas, monospace" font-weight="700" fill="#101922">redteam</tspan>      18 attacks on the agent</text>
  <text x="1590" y="644"><tspan font-family="Consolas, monospace" font-weight="700" fill="#101922">sensitivity</tspan>   2,000-profile model analysis</text>
  <text x="1590" y="676"><tspan font-family="Consolas, monospace" font-weight="700" fill="#101922">evaluate</tspan>      offline evaluation harness</text>
</g>
<text x="1590" y="714" font-size="16" fill="#53627A">Plain Node assertions &#8212; <tspan font-weight="650" fill="#101922">no test framework</tspan>,</text>
<text x="1590" y="738" font-size="16" fill="#53627A">so the suites have no dependencies either.</text>
<text x="1590" y="774" font-size="16" fill="#53627A">Deployed by Vercel from <tspan font-family="Consolas, monospace" fill="#101922">main</tspan>, on push.</text>

<!-- ══════ RIGHT: what is absent ══════ -->
<rect x="1560" y="824" width="640" height="352" rx="16" fill="#FDF4F2" stroke="#D99B8C" stroke-width="2.4"/>
<text x="1590" y="862" font-size="20" font-weight="700" fill="#B8372A">Deliberately absent</text>
<g font-size="16" fill="#8A3B2E">
  <text x="1590" y="898">TypeScript &#8212; 0 .ts files</text>
  <text x="1590" y="930">CSS framework &#8212; 0 .css files</text>
  <text x="1590" y="962">Chart library &#8212; the SVG is written out</text>
  <text x="1590" y="994">Icon font &#8212; icons are inline paths</text>
  <text x="1590" y="1026">State manager &#8212; React state suffices</text>
  <text x="1590" y="1058">ORM, database driver, session store</text>
  <text x="1590" y="1090">Analytics, tag manager, cookie banner</text>
  <text x="1590" y="1122">Auth provider &#8212; there are no accounts</text>
</g>
<text x="1590" y="1158" font-size="15.5" font-style="italic" fill="#B8372A">Each absence is a smaller attack surface to argue for.</text>

<!-- footer -->
<text x="44" y="1226" font-size="17" font-weight="700" fill="#101922">Why so little</text>
<text x="44" y="1256" font-size="16" fill="#53627A">A tool that asks people to trust it with an email address has to be auditable, and a reader can only audit what they can finish reading. 6,559 lines</text>
<text x="44" y="1282" font-size="16" fill="#53627A">of application code and three dependencies can be read in an afternoon; the privacy claims in Chapter 8 are checkable rather than promised.</text>
<text x="44" y="1316" font-size="15" fill="#8792A6">MSc research prototype &#183; &#211;buda University &#183; counts taken from the repository at the current commit</text>
</svg>
