<path d="M315,892 L598,892 L598,1140 L690,1140" fill="none" stroke="#14202E" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="440" y="918" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="start" font-weight="400">after 15 min</text>
<path d="M36,1000 L538,1000 L556,1018 L556,1282 L36,1282 Z" fill="#FFFFFF" stroke="#0D7D74" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M538,1000 L538,1018 L556,1018" fill="none" stroke="#0D7D74" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="52" y="1028" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="start" font-weight="600">Where the state is kept</text>
<text x="52" y="1052" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">Every state here is held by the browser as</text>
<text x="52" y="1073" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">a signed token. No row of any kind is</text>
<text x="52" y="1094" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">written on the server: it reads the state</text>
<text x="52" y="1115" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">from the signature on each request, and</text>
<text x="52" y="1136" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">forgets it when the response is sent.</text>
<text x="52" y="1157" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400"></text>
<text x="52" y="1178" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">This is what Chapter 8 means by zero</text>
<text x="52" y="1199" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">storage by construction. A session that is</text>
<text x="52" y="1220" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">never written cannot be enumerated,</text>
<text x="52" y="1241" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">exported or breached afterwards.</text>
<rect x="14" y="1334" width="972" height="56" rx="8" fill="#F6F8FA" stroke="#B9C4D0" stroke-width="1.4"/>
