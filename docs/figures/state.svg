<text x="800" y="1100.0" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="24" fill="#14202E" text-anchor="middle" font-weight="600">Expired</text>
<path d="M696.0,1116.0 L904.0,1116.0" stroke="#B9C4D0" stroke-width="1.5"/>
<text x="800" y="1144.0" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#B8862F" text-anchor="middle" font-weight="400" font-style="italic">token stale</text>
<text x="800" y="1170.0" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">re-verify to resume</text>
<circle cx="800" cy="1278" r="19" fill="none" stroke="#14202E" stroke-width="2.6"/>
<circle cx="800" cy="1278" r="11" fill="#14202E"/>
