<text x="500" y="790" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">POST /breach</text>
<text x="500" y="814" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">[token binds identifier]</text>
<path d="M848.0,772 L848.0,706 L752.0,706 L752.0,766" fill="none" stroke="#14202E" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="800" y="676" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#14202E" text-anchor="middle" font-weight="400">POST /chat</text>
<text x="800" y="700" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif" font-size="22" fill="#5A6B7F" text-anchor="middle" font-weight="400">[under daily cap]</text>
