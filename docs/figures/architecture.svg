<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="930" viewBox="0 0 1180 930"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Exposio system architecture</title>
<desc>Three tiers: the browser, stateless edge functions, and third-party services. No database.</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#44506A"/>
  </marker>
  <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#0E7C5A"/>
  </marker>
</defs>
<rect width="1180" height="930" fill="#FFFFFF"/>

<text x="40" y="44" font-size="23" font-weight="700" fill="#141A24">Exposio &#8212; system architecture</text>
<text x="40" y="68" font-size="13.5" fill="#55607A">Stateless: no database, no accounts. No breach lookup happens until the person has proved the identifier is theirs.</text>

<rect x="40" y="92" width="1100" height="128" rx="10" fill="#F4F7FB" stroke="#CFD8E6"/>
<text x="58" y="115" font-size="12" font-weight="700" fill="#44506A" letter-spacing="1.2">1 &#183; THE BROWSER</text>
<rect x="62" y="128" width="246" height="74" rx="8" fill="#FFFFFF" stroke="#8FA2BE" stroke-width="1.4"/>
<text x="185" y="153" font-size="14" font-weight="650" fill="#141A24" text-anchor="middle">Exposio page</text>
<text x="185" y="172" font-size="11.5" fill="#55607A" text-anchor="middle">React &#183; score, charts, action plan,</text>
<text x="185" y="188" font-size="11.5" fill="#55607A" text-anchor="middle">drawn from the signed report</text>
<rect x="330" y="128" width="272" height="74" rx="8" fill="#FFFFFF" stroke="#0E7C5A" stroke-width="1.7"/>
<text x="466" y="151" font-size="13.5" font-weight="650" fill="#0E7C5A" text-anchor="middle">Password check (k-anonymity)</text>
<text x="466" y="171" font-size="11.5" fill="#2F6B55" text-anchor="middle">SHA-1 computed here. Only the first</text>
<text x="466" y="187" font-size="11.5" fill="#2F6B55" text-anchor="middle">5 hex characters are ever sent.</text>
<rect x="624" y="128" width="216" height="74" rx="8" fill="#FFFFFF" stroke="#CFD8E6"/>
<text x="732" y="153" font-size="13" font-weight="650" fill="#141A24" text-anchor="middle">Memory only</text>
<text x="732" y="173" font-size="11.5" fill="#55607A" text-anchor="middle">closing the tab ends it;</text>
<text x="732" y="189" font-size="11.5" fill="#55607A" text-anchor="middle">nothing is written down</text>
<rect x="862" y="128" width="256" height="74" rx="8" fill="#FBF1EF" stroke="#D99A8E"/>
<text x="990" y="153" font-size="13" font-weight="650" fill="#B23A2C" text-anchor="middle">No database. No accounts.</text>
<text x="990" y="173" font-size="11.5" fill="#8C4336" text-anchor="middle">Nothing to breach, subpoena</text>
<text x="990" y="189" font-size="11.5" fill="#8C4336" text-anchor="middle">or sell later.</text>

<rect x="40" y="276" width="1100" height="248" rx="10" fill="#F7F5FB" stroke="#D3CCE6"/>
<text x="58" y="299" font-size="12" font-weight="700" fill="#4B4472" letter-spacing="1.2">2 &#183; EXPOSIO &#8212; STATELESS EDGE FUNCTIONS (Vercel)</text>
<rect x="62" y="312" width="238" height="86" rx="8" fill="#FFFFFF" stroke="#9A8FC4" stroke-width="1.4"/>
<text x="181" y="334" font-size="12.5" font-weight="700" fill="#4B4472" text-anchor="middle">/api/verify/start</text>
<text x="181" y="355" font-size="11.5" fill="#55607A" text-anchor="middle">makes a one-time code and a</text>
<text x="181" y="371" font-size="11.5" fill="#55607A" text-anchor="middle">signed challenge token</text>
<text x="181" y="390" font-size="11" fill="#8A7FB5" text-anchor="middle">rate limited per address and per IP</text>
<rect x="314" y="312" width="238" height="86" rx="8" fill="#FFFFFF" stroke="#B23A2C" stroke-width="1.8"/>
<text x="433" y="334" font-size="12.5" font-weight="700" fill="#B23A2C" text-anchor="middle">/api/verify/check</text>
<text x="433" y="355" font-size="11.5" fill="#55607A" text-anchor="middle">checks the code, returns a</text>
<text x="433" y="371" font-size="11.5" fill="#55607A" text-anchor="middle">scan token, valid 15 minutes</text>
<text x="433" y="390" font-size="11" font-weight="700" fill="#B23A2C" text-anchor="middle">THE OWNERSHIP GATE</text>
<rect x="566" y="312" width="238" height="86" rx="8" fill="#FFFFFF" stroke="#9A8FC4" stroke-width="1.4"/>
<text x="685" y="334" font-size="12.5" font-weight="700" fill="#4B4472" text-anchor="middle">/api/breach</text>
<text x="685" y="355" font-size="11.5" fill="#55607A" text-anchor="middle">checks the token, queries the</text>
<text x="685" y="371" font-size="11.5" fill="#55607A" text-anchor="middle">sources, scores, builds a report</text>
<text x="685" y="390" font-size="11" fill="#8A7FB5" text-anchor="middle">refuses without a matching token</text>
<rect x="818" y="312" width="238" height="86" rx="8" fill="#FFFFFF" stroke="#9A8FC4" stroke-width="1.4"/>
<text x="937" y="334" font-size="12.5" font-weight="700" fill="#4B4472" text-anchor="middle">/api/chat</text>
<text x="937" y="355" font-size="11.5" fill="#55607A" text-anchor="middle">ExpoBot &#8212; a bounded tool loop</text>
<text x="937" y="371" font-size="11.5" fill="#55607A" text-anchor="middle">over the signed report</text>
<text x="937" y="390" font-size="11" fill="#8A7FB5" text-anchor="middle">may name only vetted actions</text>

<rect x="62" y="418" width="994" height="88" rx="8" fill="#FFFFFF" stroke="#CFD8E6" stroke-dasharray="5 4"/>
<text x="82" y="440" font-size="12" font-weight="700" fill="#44506A">Pure modules &#8212; no network, no storage. The same code runs on the server, in the browser and in the offline tests.</text>
<text x="82" y="464" font-size="11.5" fill="#55607A"><tspan font-weight="650" fill="#141A24">tokens.js</tspan> HMAC-SHA256; keyed hash of the identifier &#160;&#183;&#160; <tspan font-weight="650" fill="#141A24">score.js</tspan> two-clock Breach Risk &#160;&#183;&#160; <tspan font-weight="650" fill="#141A24">playbook.js</tspan> vetted actions, residual risk</text>
<text x="82" y="484" font-size="11.5" fill="#55607A"><tspan font-weight="650" fill="#141A24">sources.js</tspan> query and merge &#160;&#183;&#160; <tspan font-weight="650" fill="#141A24">agent.js</tspan> bounded loop &#160;&#183;&#160; <tspan font-weight="650" fill="#141A24">ratelimit.js</tspan> &#160;&#183;&#160; <tspan font-weight="650" fill="#141A24">mailer.js / sms.js</tspan> log a status code, never the recipient</text>

<rect x="40" y="610" width="1100" height="120" rx="10" fill="#FBF9F3" stroke="#E0D6BE"/>
<text x="58" y="633" font-size="12" font-weight="700" fill="#6B5B2E" letter-spacing="1.2">3 &#183; THIRD-PARTY SERVICES</text>
<rect x="62" y="646" width="180" height="66" rx="8" fill="#FFFFFF" stroke="#C9B785"/>
<text x="152" y="669" font-size="12.5" font-weight="650" fill="#141A24" text-anchor="middle">Have I Been Pwned</text>
<text x="152" y="687" font-size="11" fill="#55607A" text-anchor="middle">breaches for an address,</text>
<text x="152" y="702" font-size="11" fill="#55607A" text-anchor="middle">and Pwned Passwords</text>
<rect x="258" y="646" width="162" height="66" rx="8" fill="#FFFFFF" stroke="#C9B785"/>
<text x="339" y="669" font-size="12.5" font-weight="650" fill="#141A24" text-anchor="middle">DeHashed</text>
<text x="339" y="687" font-size="11" fill="#55607A" text-anchor="middle">second source, and the</text>
<text x="339" y="702" font-size="11" fill="#55607A" text-anchor="middle">only one for phones</text>
<rect x="436" y="646" width="148" height="66" rx="8" fill="#FFFFFF" stroke="#C9B785"/>
<text x="510" y="675" font-size="12.5" font-weight="650" fill="#141A24" text-anchor="middle">Resend</text>
<text x="510" y="694" font-size="11" fill="#55607A" text-anchor="middle">sends the email code</text>
<rect x="600" y="646" width="148" height="66" rx="8" fill="#FFFFFF" stroke="#C9B785"/>
<text x="674" y="675" font-size="12.5" font-weight="650" fill="#141A24" text-anchor="middle">Twilio</text>
<text x="674" y="694" font-size="11" fill="#55607A" text-anchor="middle">sends the SMS code</text>
<rect x="764" y="646" width="182" height="66" rx="8" fill="#FFFFFF" stroke="#C9B785"/>
<text x="855" y="669" font-size="12.5" font-weight="650" fill="#141A24" text-anchor="middle">Anthropic API</text>
<text x="855" y="687" font-size="11" fill="#55607A" text-anchor="middle">phrases the answer; states</text>
<text x="855" y="702" font-size="11" fill="#55607A" text-anchor="middle">no number it was not given</text>
<rect x="962" y="646" width="156" height="66" rx="8" fill="#F6F8FB" stroke="#CFD8E6" stroke-dasharray="4 3"/>
<text x="1040" y="675" font-size="12" font-weight="650" fill="#55607A" text-anchor="middle">No analytics.</text>
<text x="1040" y="694" font-size="11" fill="#55607A" text-anchor="middle">No trackers. No cookies.</text>

<path d="M140 204 L165 308" stroke="#44506A" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="92" y="262" font-size="11" font-weight="700" fill="#44506A">1</text>
<text x="104" y="262" font-size="10.5" fill="#55607A">address</text>
<path d="M238 204 L404 308" stroke="#44506A" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<text x="286" y="248" font-size="11" font-weight="700" fill="#44506A">3</text>
<text x="298" y="248" font-size="10.5" fill="#55607A">the code they received</text>
<path d="M286 204 L656 308" stroke="#44506A" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
<text x="540" y="238" font-size="11" font-weight="700" fill="#44506A">4</text>
<text x="552" y="238" font-size="10.5" fill="#55607A">address + scan token</text>
<path d="M300 204 L908 308" stroke="#44506A" stroke-width="1.2" fill="none" marker-end="url(#ar)" stroke-dasharray="4 4"/>
<text x="770" y="288" font-size="11" font-weight="700" fill="#44506A">6</text>
<text x="782" y="288" font-size="10.5" fill="#55607A">question + report token</text>

<path d="M180 508 L158 642" stroke="#44506A" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M300 508 L334 642" stroke="#44506A" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="196" y="580" font-size="11" font-weight="700" fill="#44506A">5</text>
<text x="208" y="580" font-size="10.5" fill="#55607A">look up, merge, score</text>
<path d="M500 508 L508 642" stroke="#44506A" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M660 508 L672 642" stroke="#44506A" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="536" y="580" font-size="11" font-weight="700" fill="#44506A">2</text>
<text x="548" y="580" font-size="10.5" fill="#55607A">the one-time code goes out</text>
<path d="M880 508 L858 642" stroke="#44506A" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text x="886" y="580" font-size="10.5" fill="#55607A">report contents</text>

<path d="M466 126 L466 84 L22 84 L22 679 L58 679" stroke="#0E7C5A" stroke-width="2" fill="none"
      stroke-dasharray="7 5" marker-end="url(#arG)"/>
<text x="16" y="400" font-size="11.5" font-weight="700" fill="#0E7C5A" transform="rotate(-90 16 400)" text-anchor="middle">the password path never reaches the Exposio server</text>

<rect x="40" y="752" width="1100" height="60" rx="9" fill="#EEF6F2" stroke="#9FCBB8"/>
<text x="62" y="776" font-size="12.5" font-weight="700" fill="#1F5C47">State lives in the token, not on a server.</text>
<text x="62" y="797" font-size="11.5" fill="#2F6B55">A token reads <tspan font-family="Consolas, monospace">v1.&lt;payload&gt;.&lt;signature&gt;</tspan>. The signature is checked before the payload is parsed, and the payload carries a <tspan font-weight="650">keyed hash</tspan> of the identifier &#8212; never the address itself.</text>

<text x="40" y="844" font-size="12" font-weight="700" fill="#141A24">What crosses each boundary</text>
<text x="40" y="864" font-size="11.5" fill="#55607A">Browser to server: the address being checked, and the token proving it was verified. Never the password.</text>
<text x="40" y="882" font-size="11.5" fill="#55607A">Server to third parties: the address, to the breach sources; the report contents, to the language model. Never a stored record, because none exists.</text>
<text x="40" y="900" font-size="11.5" fill="#55607A">Server to disk: nothing at all.</text>
<text x="40" y="920" font-size="11" fill="#8A93A6">MSc research prototype &#183; &#211;buda University &#183; the diagram covers Breach Risk (component B of the Exposure Score)</text>
</svg>
