<text x="40" y="436" font-size="25" fill="#14202E" text-anchor="start" font-weight="600">B · Recovering dates removes the model's most sensitive assumption</text>
<text x="40" y="462" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">spread in rank correlation as the undated-age assumption is swept 180–2,920 days  ·  npm run sensitivity</text>
