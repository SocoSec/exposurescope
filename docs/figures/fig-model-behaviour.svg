<text x="40" y="158" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">2,000 synthetic profiles, 200 trials per level  ·  npm run sensitivity</text>
<text x="112" y="190" font-size="22" fill="#5A6B7F" text-anchor="start" font-weight="400">Spearman ρ of the ranking</text>
