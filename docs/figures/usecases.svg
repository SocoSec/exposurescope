<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1440" viewBox="0 0 2280 1440"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Exposio use case diagram</title>
<desc>UML use case diagram: one human actor, six supporting system actors, and the use cases of the Exposio prototype.</desc>

<defs>
  <marker id="inc" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
    <path d="M1 1 L11 6 L1 11" fill="none" stroke="#5A6B85" stroke-width="1.8"/>
  </marker>
  <marker id="incr" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
    <path d="M1 1 L11 6 L1 11" fill="none" stroke="#B8372A" stroke-width="1.8"/>
  </marker>
</defs>

<rect width="2280" height="1440" fill="#FFFFFF"/>
<text x="44" y="58" font-size="33" font-weight="700" fill="#101922">Exposio &#8212; use case diagram</text>
<text x="44" y="92" font-size="18.5" fill="#53627A">UML. One human actor. The supporting actors are systems, because the prototype has no operator, no administrator and no account holder.</text>

<!-- system boundary -->
<rect x="470" y="150" width="1120" height="1190" rx="10" fill="#FBFCFE" stroke="#3A4860" stroke-width="3"/>
<text x="1030" y="194" font-size="27" font-weight="700" fill="#101922" text-anchor="middle">Exposio</text>

<!-- ─────────── primary actor ─────────── -->
<g stroke="#101922" stroke-width="4.5" fill="none" stroke-linecap="round">
  <circle cx="214" cy="636" r="34" fill="#FFFFFF"/>
  <path d="M214 670 v92"/>
  <path d="M152 706 h124"/>
  <path d="M214 762 l-46 76 M214 762 l46 76"/>
</g>
<text x="214" y="888" font-size="23" font-weight="700" fill="#101922" text-anchor="middle">The person</text>
<text x="214" y="916" font-size="18" fill="#53627A" text-anchor="middle">(data subject)</text>
<text x="214" y="946" font-size="16.5" fill="#8792A6" text-anchor="middle">checking their own data</text>

<!-- ─────────── primary use cases ─────────── -->
<g font-size="18.5" fill="#101922" text-anchor="middle">
  <ellipse cx="730" cy="290" rx="168" ry="46" fill="#E9F3FB" stroke="#2F86C4" stroke-width="2.6"/>
  <text x="730" y="297" font-weight="600">Check an email address</text>

  <ellipse cx="730" cy="410" rx="168" ry="46" fill="#E9F3FB" stroke="#2F86C4" stroke-width="2.6"/>
  <text x="730" y="417" font-weight="600">Check a phone number</text>

  <ellipse cx="730" cy="530" rx="168" ry="46" fill="#E4F3EC" stroke="#15785A" stroke-width="2.6"/>
  <text x="730" y="537" font-weight="600">Check a password</text>

  <ellipse cx="730" cy="668" rx="168" ry="52" fill="#E9F3FB" stroke="#2F86C4" stroke-width="2.6"/>
  <text x="730" y="662">Explore where the</text>
  <text x="730" y="688">exposure comes from</text>

  <ellipse cx="730" cy="806" rx="168" ry="52" fill="#E9F3FB" stroke="#2F86C4" stroke-width="2.6"/>
  <text x="730" y="800">Work through the</text>
  <text x="730" y="826">ranked action plan</text>

  <ellipse cx="730" cy="944" rx="168" ry="46" fill="#E9F3FB" stroke="#2F86C4" stroke-width="2.6"/>
  <text x="730" y="951" font-weight="600">Ask the advisory agent</text>

  <ellipse cx="730" cy="1064" rx="168" ry="46" fill="#E9F3FB" stroke="#2F86C4" stroke-width="2.6"/>
  <text x="730" y="1071" font-weight="600">Save or print the report</text>

  <ellipse cx="730" cy="1184" rx="168" ry="46" fill="#E9F3FB" stroke="#2F86C4" stroke-width="2.6"/>
  <text x="730" y="1191" font-weight="600">Read it in six languages</text>
</g>

<!-- ─────────── supporting use cases ─────────── -->
<g font-size="17.5" fill="#101922" text-anchor="middle">
  <ellipse cx="1300" cy="282" rx="166" ry="52" fill="#FAE8E4" stroke="#B8372A" stroke-width="3.2"/>
  <text x="1300" y="276" font-weight="700" fill="#B8372A">Prove ownership of</text>
  <text x="1300" y="302" font-weight="700" fill="#B8372A">the identifier</text>

  <ellipse cx="1300" cy="402" rx="166" ry="46" fill="#F3F0FB" stroke="#6D55BD" stroke-width="2.4"/>
  <text x="1300" y="409">Deliver a one-time code</text>

  <ellipse cx="1300" cy="522" rx="166" ry="46" fill="#F3F0FB" stroke="#6D55BD" stroke-width="2.4"/>
  <text x="1300" y="529">Apply rate limits</text>

  <ellipse cx="1300" cy="648" rx="166" ry="52" fill="#E4F3EC" stroke="#15785A" stroke-width="2.6"/>
  <text x="1300" y="642" fill="#15785A" font-weight="650">Send a 5-character</text>
  <text x="1300" y="668" fill="#15785A" font-weight="650">hash prefix only</text>

  <ellipse cx="1300" cy="774" rx="166" ry="46" fill="#F3F0FB" stroke="#6D55BD" stroke-width="2.4"/>
  <text x="1300" y="781">Query the breach sources</text>

  <ellipse cx="1300" cy="894" rx="166" ry="52" fill="#F3F0FB" stroke="#6D55BD" stroke-width="2.4"/>
  <text x="1300" y="888">Compute the</text>
  <text x="1300" y="914">Breach Risk score</text>

  <ellipse cx="1300" cy="1020" rx="166" ry="46" fill="#F3F0FB" stroke="#6D55BD" stroke-width="2.4"/>
  <text x="1300" y="1027">Recompute residual risk</text>

  <ellipse cx="1300" cy="1140" rx="166" ry="52" fill="#FFF6E2" stroke="#C97612" stroke-width="2.4"/>
  <text x="1300" y="1134">Draft GDPR Art. 15</text>
  <text x="1300" y="1160">and Art. 17 letters</text>

  <ellipse cx="1300" cy="1262" rx="166" ry="46" fill="#F3F0FB" stroke="#6D55BD" stroke-width="2.4"/>
  <text x="1300" y="1269">Validate the signed token</text>
</g>

<!-- ─────────── supporting actors ─────────── -->
<g font-size="18" text-anchor="middle">
  <rect x="1686" y="368" width="270" height="68" rx="9" fill="#F4F7FB" stroke="#3A4860" stroke-width="2.6"/>
  <text x="1821" y="394" font-size="14.5" fill="#53627A">&#171;system&#187;</text>
  <text x="1821" y="420" font-weight="700" fill="#101922">Resend</text>

  <rect x="1686" y="488" width="270" height="68" rx="9" fill="#F4F7FB" stroke="#3A4860" stroke-width="2.6"/>
  <text x="1821" y="514" font-size="14.5" fill="#53627A">&#171;system&#187;</text>
  <text x="1821" y="540" font-weight="700" fill="#101922">Twilio</text>

  <rect x="1686" y="614" width="270" height="68" rx="9" fill="#E4F3EC" stroke="#15785A" stroke-width="2.6"/>
  <text x="1821" y="640" font-size="14.5" fill="#15785A">&#171;system&#187;</text>
  <text x="1821" y="666" font-weight="700" fill="#15785A">Pwned Passwords</text>

  <rect x="1686" y="740" width="270" height="68" rx="9" fill="#F4F7FB" stroke="#3A4860" stroke-width="2.6"/>
  <text x="1821" y="766" font-size="14.5" fill="#53627A">&#171;system&#187;</text>
  <text x="1821" y="792" font-weight="700" fill="#101922">Have I Been Pwned</text>

  <rect x="1686" y="860" width="270" height="68" rx="9" fill="#F4F7FB" stroke="#3A4860" stroke-width="2.6"/>
  <text x="1821" y="886" font-size="14.5" fill="#53627A">&#171;system&#187;</text>
  <text x="1821" y="912" font-weight="700" fill="#101922">DeHashed</text>

  <rect x="1686" y="1228" width="270" height="68" rx="9" fill="#F4F7FB" stroke="#3A4860" stroke-width="2.6"/>
  <text x="1821" y="1254" font-size="14.5" fill="#53627A">&#171;system&#187;</text>
  <text x="1821" y="1280" font-weight="700" fill="#101922">Anthropic API</text>
</g>

<!-- ─────────── associations : actor to use cases ─────────── -->
<g stroke="#3A4860" stroke-width="2.4" fill="none">
  <path d="M276 690 L562 300"/>
  <path d="M276 694 L562 416"/>
  <path d="M276 700 L562 530"/>
  <path d="M276 716 L562 664"/>
  <path d="M276 740 L562 802"/>
  <path d="M276 756 L562 938"/>
  <path d="M276 768 L562 1058"/>
  <path d="M276 780 L562 1178"/>
</g>

<!-- ─────────── include / extend ─────────── -->
<g stroke="#5A6B85" stroke-width="2.2" fill="none" stroke-dasharray="9 6" marker-end="url(#inc)">
  <path d="M898 286 L1128 283"/>
  <path d="M898 414 L1130 300"/>
  <path d="M1300 328 L1300 352"/>
  <path d="M898 300 L1134 508"/>
  <path d="M898 424 L1134 516"/>
  <path d="M898 318 L1136 764"/>
  <path d="M898 434 L1136 772"/>
  <path d="M898 330 L1138 884"/>
  <path d="M898 444 L1138 892"/>
  <path d="M898 820 L1136 1012"/>
  <path d="M898 952 L1136 1254"/>
</g>
<g stroke="#B8372A" stroke-width="2.6" fill="none" stroke-dasharray="9 6" marker-end="url(#incr)">
  <path d="M898 536 L1136 638"/>
</g>
<g stroke="#C97612" stroke-width="2.4" fill="none" stroke-dasharray="9 6" marker-end="url(#inc)">
  <path d="M1140 1120 L906 826"/>
</g>

<g font-size="15.5" fill="#5A6B85" font-style="italic">
  <text x="975" y="276">&#171;include&#187;</text>
  <text x="988" y="352">&#171;include&#187;</text>
  <text x="1318" y="346">&#171;include&#187;</text>
  <text x="1000" y="430">&#171;include&#187;</text>
  <text x="1004" y="560">&#171;include&#187;</text>
  <text x="1008" y="690">&#171;include&#187;</text>
  <text x="1004" y="900">&#171;include&#187;</text>
  <text x="1016" y="1172" fill="#C97612">&#171;extend&#187;</text>
  <text x="1000" y="1090">&#171;include&#187;</text>
  <text x="906" y="606" fill="#B8372A">&#171;include&#187;</text>
</g>

<!-- ─────────── use case to supporting actor ─────────── -->
<g stroke="#3A4860" stroke-width="2.4" fill="none">
  <path d="M1466 400 L1680 400"/>
  <path d="M1466 412 L1680 518"/>
  <path d="M1466 648 L1680 648"/>
  <path d="M1466 778 L1680 772"/>
  <path d="M1466 790 L1680 892"/>
  <path d="M1466 1264 L1680 1262"/>
</g>

<!-- ─────────── notes ─────────── -->
<!-- kept clear of the system boundary, which begins at x = 470 -->
<path d="M34 1046 h400 v196 l-26 26 H34 z" fill="#FCF4D2" stroke="#CBB246" stroke-width="2.4"/>
<path d="M434 1242 h-26 v26 z" fill="#E9DC9E" stroke="#CBB246" stroke-width="2.4"/>
<text x="58" y="1084" font-size="18" font-weight="700" fill="#6E5A0D">Why a password needs no proof</text>
<text x="58" y="1116" font-size="16" fill="#6E5A0D">Checking an address asks a question</text>
<text x="58" y="1142" font-size="16" fill="#6E5A0D">about a person, so ownership has to be</text>
<text x="58" y="1168" font-size="16" fill="#6E5A0D">proved first. Checking a password asks</text>
<text x="58" y="1194" font-size="16" fill="#6E5A0D">about a secret the person supplies, and</text>
<text x="58" y="1220" font-size="16" fill="#6E5A0D">it never leaves the browser.</text>

<path d="M34 1294 h400 v118 l-26 26 H34 z" fill="#F1F3F6" stroke="#90A0B6" stroke-width="2.4"/>
<path d="M434 1412 h-26 v26 z" fill="#DDE3EB" stroke="#90A0B6" stroke-width="2.4"/>
<text x="58" y="1332" font-size="18" font-weight="700" fill="#101922">No administrator appears here</text>
<text x="58" y="1364" font-size="16" fill="#243247">There is no operator, moderator or</text>
<text x="58" y="1390" font-size="16" fill="#243247">account-holder role: nothing is stored,</text>
<text x="58" y="1416" font-size="16" fill="#243247">so there is nothing to administer.</text>

<!-- key -->
<rect x="1686" y="1004" width="552" height="188" rx="12" fill="#F7F9FC" stroke="#C3D0DF" stroke-width="2"/>
<text x="1710" y="1040" font-size="18.5" font-weight="700" fill="#101922">Reading the diagram</text>
<ellipse cx="1744" cy="1070" rx="26" ry="13" fill="#E9F3FB" stroke="#2F86C4" stroke-width="2"/>
<text x="1786" y="1076" font-size="16" fill="#53627A">a goal the person has</text>
<ellipse cx="1744" cy="1108" rx="26" ry="13" fill="#F3F0FB" stroke="#6D55BD" stroke-width="2"/>
<text x="1786" y="1114" font-size="16" fill="#53627A">a step the system always performs</text>
<path d="M1720 1146 h48" stroke="#5A6B85" stroke-width="2.2" stroke-dasharray="9 6" fill="none" marker-end="url(#inc)"/>
<text x="1786" y="1152" font-size="16" fill="#53627A">&#171;include&#187; &#8212; always happens</text>
<path d="M1720 1176 h48" stroke="#C97612" stroke-width="2.2" stroke-dasharray="9 6" fill="none" marker-end="url(#inc)"/>
<text x="1786" y="1182" font-size="16" fill="#53627A">&#171;extend&#187; &#8212; happens if chosen</text>

<text x="640" y="1402" font-size="15.5" fill="#8792A6">MSc research prototype &#183; &#211;buda University &#183; the diagram describes the implemented prototype, not the full Exposure Score model</text>
</svg>
